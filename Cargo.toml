[package]
name = "omaroute"
version = "0.1.0"
edition = "2024"
description = "Route links from each app to the browser of your choice (Omarchy)"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = true
strip = true
opt-level = "s"
