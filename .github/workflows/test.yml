name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch matches the PKGBUILD and ships a gtk4-layer-shell new enough for the crate.
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git rust gtk4 gtk4-layer-shell pkgconf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
